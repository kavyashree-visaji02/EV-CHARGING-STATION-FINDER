name: EV Charging Station Finder CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        id: tests
        run: python -m unittest discover -v

      - name: Post-build report
        if: always()
        run: |
          echo "## EV Charging Station Finder Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Test result: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
